<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="../css/form.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h2>Đổi mật khẩu</h2>
            <p>Nhập thông tin bên dưới để chủ động bảo vệ tài khoản</p>
        </div>

        <div id="alertMessage" class="alert-message"></div>

        <form id="changePasswordForm">
            <!-- Mật khẩu hiện tại -->
            <div class="form-group">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <div class="input-wrapper">
                    <input type="password" id="currentPassword" placeholder="Nhập mật khẩu hiện tại">
                    <button type="button" class="toggle-password" data-target="currentPassword" aria-label="Hiện/ẩn mật khẩu">
                        <svg class="eye-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- Mật khẩu mới -->
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" placeholder="Tối thiểu 8 ký tự (chứa chữ và số)">
                    <button type="button" class="toggle-password" data-target="newPassword" aria-label="Hiện/ẩn mật khẩu">
                        <svg class="eye-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- Nhập lại mật khẩu mới -->
            <div class="form-group">
                <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu mới">
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Hiện/ẩn mật khẩu">
                        <svg class="eye-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Xác nhận đổi mật khẩu</button>
        </form>
    </div>

    <script src="../js/password.js"></script>
</body>
</html>
