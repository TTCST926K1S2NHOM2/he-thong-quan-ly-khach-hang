<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khóa/Mở khóa tài khoản</title>
    <link rel="stylesheet" href="../../css/users.css">
</head>
<body>
    <div class="container">
        <h2>Danh sách tài khoản</h2>
        
        <!-- Thông báo kết quả -->
        <div id="alert-message" class="alert hidden"></div>

        <table class="user-table">
            <thead>
                <tr>
                    <th>Tên tài khoản</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <!-- Dữ liệu mẫu -->
                <tr data-id="1">
                    <td class="username">Nguyễn Văn A</td>
                    <td><span class="status active">Đang hoạt động</span></td>
                    <td>
                        <button class="btn btn-lock">Khóa</button>
                        <button class="btn btn-unlock hidden">Mở khóa</button>
                    </td>
                </tr>
                <tr data-id="2">
                    <td class="username">Nguyễn Văn B</td>
                    <td><span class="status locked">Đã khóa</span></td>
                    <td>
                        <button class="btn btn-lock hidden">Khóa</button>
                        <button class="btn btn-unlock">Mở khóa</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="../../js/users.js"></script>
</body>
</html>
