<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quên mật khẩu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background: #f7f7fc;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           KHUNG QUÊN MẬT KHẨU
        ========================= */

        .forgot-container {
            width: 100%;
            max-width: 400px;

            background: #ffffff;

            padding: 38px 40px 32px;

            border-radius: 22px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        /* =========================
           TIÊU ĐỀ
        ========================= */

        .forgot-container h1 {
            color: #17213a;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 22px;
        }

        /* =========================
           MÔ TẢ
        ========================= */

        .description {
            color: #71809c;

            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 32px;
        }

        /* =========================
           LABEL
        ========================= */

        .form-group {
            text-align: left;

            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            color: #26334f;

            font-size: 16px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        /* =========================
           INPUT
        ========================= */

        .form-group input {
            width: 100%;

            height: 42px;

            border: none;

            outline: none;

            border-radius: 24px;

            background: #eeeeF8;

            padding: 0 17px;

            font-size: 15px;

            color: #26334f;

            transition: 0.2s;
        }

        .form-group input:focus {
            background: #e8e8f5;

            box-shadow:
                0 0 0 2px rgba(0, 232, 90, 0.25);
        }

        .form-group input::placeholder {
            color: #aeb2c2;
        }

        /* =========================
           NÚT GỬI YÊU CẦU
        ========================= */

        .submit-button {
            width: 100%;

            height: 42px;

            border: none;

            border-radius: 24px;

            background: #00e85a;

            color: #111111;

            font-size: 16px;

            font-weight: 500;

            cursor: pointer;

            margin-top: 4px;

            transition: 0.2s;
        }

        .submit-button:hover {
            background: #00d952;
        }

        .submit-button:active {
            transform: scale(0.98);
        }

        .submit-button:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }

        /* =========================
           THÔNG BÁO
        ========================= */

        #message {
            min-height: 24px;

            margin-top: 18px;

            font-size: 16px;

            line-height: 1.4;
        }

        /* =========================
           QUAY LẠI LOGIN
        ========================= */

        .back-login {
            display: inline-block;

            margin-top: 22px;

            color: #285eea;

            text-decoration: none;

            font-size: 16px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 480px) {

            .forgot-container {
                width: calc(100% - 30px);

                padding: 32px 25px 28px;
            }

            .forgot-container h1 {
                font-size: 27px;
            }

            .description {
                font-size: 15px;
            }
        }
    </style>
</head>


<body>

    <div class="forgot-container">

        <h1>Quên mật khẩu</h1>

        <p class="description">
            Nhập email tài khoản của bạn để nhận yêu cầu
            đặt lại mật khẩu.
        </p>


        <form id="forgotPasswordForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                id="submitButton"
                class="submit-button"
            >
                Gửi yêu cầu
            </button>

        </form>


        <div id="message"></div>


        <a
            href="../index.html"
            class="back-login"
        >
            Quay lại đăng nhập
        </a>

    </div>


    <!-- Giữ JavaScript S1-03 hiện tại của bạn -->
    <script src="../js/password.js"></script>

</body>

</html>
