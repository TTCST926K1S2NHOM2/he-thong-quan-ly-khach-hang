<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đổi mật khẩu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7f7fb;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           CARD
        ========================= */

        .change-password-container {
            width: 325px;

            background: #ffffff;

            padding: 38px 40px;

            border-radius: 22px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.10);
        }


        /* =========================
           TIÊU ĐỀ
        ========================= */

        .title {
            margin: 0 0 10px;

            text-align: center;

            color: #102a56;

            font-size: 26px;

            font-weight: 700;
        }


        .subtitle {
            margin: 0 0 26px;

            text-align: center;

            color: #6680a5;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #102a56;

            font-size: 14px;

            font-weight: 500;
        }


        /* =========================
           INPUT
        ========================= */

        .password-wrapper {
            position: relative;
        }


        .password-wrapper input {
            width: 100%;

            height: 42px;

            padding: 0 45px 0 16px;

            border: none;

            border-radius: 25px;

            outline: none;

            background: #eeeeF8;

            color: #333333;

            font-size: 13px;

            transition: 0.2s;
        }


        .password-wrapper input::placeholder {
            color: #a5a9bb;
        }


        .password-wrapper input:focus {
            background: #e8e8f5;

            box-shadow:
                0 0 0 2px rgba(0, 102, 255, 0.12);
        }


        /* =========================
           HIỆN / ẨN MẬT KHẨU
        ========================= */

        .toggle-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #64748b;

            cursor: pointer;

            font-size: 16px;

            padding: 0;
        }


        .toggle-password:hover {
            color: #2563eb;
        }


        /* =========================
           THÔNG BÁO
        ========================= */

        .alert-message {
            min-height: 20px;

            margin-top: 4px;
            margin-bottom: 8px;

            text-align: center;

            font-size: 12px;

            line-height: 1.4;
        }


        .alert-message.error {
            color: #dc2626;
        }


        .alert-message.success {
            color: #16a34a;
        }


        /* =========================
           NÚT XÁC NHẬN
        ========================= */

        .submit-button {
            width: 100%;

            height: 42px;

            margin-top: 8px;

            border: none;

            border-radius: 25px;

            background: #00e85a;

            color: #000000;

            font-size: 13px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.2s;
        }


        .submit-button:hover {
            background: #00d653;
        }


        .submit-button:disabled {
            opacity: 0.65;

            cursor: not-allowed;
        }


        /* =========================
           QUAY VỀ TRANG CHỦ
        ========================= */

        .back-home {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #6680a5;

            font-size: 13px;

            font-weight: 500;

            text-decoration: none;

            transition: 0.2s;
        }


        .back-home:hover {
            color: #2563eb;

            text-decoration: underline;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 480px) {

            .change-password-container {
                width: calc(100% - 30px);

                padding: 32px 30px;
            }


            .title {
                font-size: 24px;
            }


            .subtitle {
                font-size: 13px;
            }
        }

    </style>
</head>


<body>

    <div class="change-password-container">


        <!-- =========================
             TIÊU ĐỀ
        ========================== -->

        <h1 class="title">
            Đổi mật khẩu
        </h1>


        <p class="subtitle">
            Nhập thông tin bên dưới để chủ động bảo vệ tài khoản
        </p>


        <!-- =========================
             FORM ĐỔI MẬT KHẨU
        ========================== -->

        <form id="changePasswordForm">


            <!-- MẬT KHẨU HIỆN TẠI -->

            <div class="form-group">

                <label for="currentPassword">
                    Mật khẩu hiện tại
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Nhập mật khẩu hiện tại"
                        autocomplete="current-password"
                    >


                    <button
                        type="button"
                        class="toggle-password"
                        data-target="currentPassword"
                        aria-label="Hiện hoặc ẩn mật khẩu"
                    >
                        
                    </button>

                </div>

            </div>


            <!-- MẬT KHẨU MỚI -->

            <div class="form-group">

                <label for="newPassword">
                    Mật khẩu mới
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Tối thiểu 8 ký tự (chứa chữ và số)"
                        autocomplete="new-password"
                    >


                    <button
                        type="button"
                        class="toggle-password"
                        data-target="newPassword"
                        aria-label="Hiện hoặc ẩn mật khẩu"
                    >
                        
                    </button>

                </div>

            </div>


            <!-- NHẬP LẠI MẬT KHẨU -->

            <div class="form-group">

                <label for="confirmPassword">
                    Nhập lại mật khẩu mới
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Xác nhận mật khẩu mới"
                        autocomplete="new-password"
                    >


                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                        aria-label="Hiện hoặc ẩn mật khẩu"
                    >
                        
                    </button>

                </div>

            </div>


            <!-- THÔNG BÁO -->

            <div
                id="alertMessage"
                class="alert-message"
            ></div>


            <!-- NÚT XÁC NHẬN -->

            <button
                type="submit"
                class="submit-button"
                id="submitButton"
            >
                Xác nhận đổi mật khẩu
            </button>


            <!-- QUAY VỀ TRANG CHỦ -->

            <a
                href="../components/sidebar.html"
                class="back-home"
            >
                Quay về trang chủ
            </a>

        </form>

    </div>


    <script>

        document.addEventListener("DOMContentLoaded", () => {


            const form =
                document.getElementById("changePasswordForm");


            const alertMessage =
                document.getElementById("alertMessage");


            const submitButton =
                document.getElementById("submitButton");


            const toggleButtons =
                document.querySelectorAll(".toggle-password");



            // =========================
            // HIỆN / ẨN MẬT KHẨU
            // =========================

            toggleButtons.forEach(button => {


                button.addEventListener("click", () => {


                    const targetId =
                        button.getAttribute("data-target");


                    const input =
                        document.getElementById(targetId);


                    if (!input) {
                        return;
                    }


                    if (input.type === "password") {

                        input.type = "text";

                        button.textContent = "◉";

                    } else {

                        input.type = "password";

                        button.textContent = "◉";

                    }

                });

            });



            // =========================
            // HIỂN THỊ THÔNG BÁO
            // =========================

            function showAlert(message, type) {

                alertMessage.textContent =
                    message;


                alertMessage.className =
                    `alert-message ${type}`;

            }



            function hideAlert() {

                alertMessage.textContent = "";


                alertMessage.className =
                    "alert-message";

            }



            // =========================
            // SUBMIT
            // =========================

            form.addEventListener("submit", (event) => {


                event.preventDefault();


                hideAlert();



                const currentPassword =
                    document
                        .getElementById("currentPassword")
                        .value
                        .trim();



                const newPassword =
                    document
                        .getElementById("newPassword")
                        .value
                        .trim();



                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value
                        .trim();



                // -------------------------
                // KIỂM TRA MẬT KHẨU HIỆN TẠI
                // -------------------------

                if (!currentPassword) {


                    showAlert(
                        "Vui lòng nhập mật khẩu hiện tại.",
                        "error"
                    );


                    return;

                }



                // -------------------------
                // KIỂM TRA MẬT KHẨU MỚI
                // -------------------------

                const passwordRegex =
                    /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;



                if (!passwordRegex.test(newPassword)) {


                    showAlert(
                        "Mật khẩu mới phải từ 8 ký tự trở lên, bao gồm ít nhất một chữ cái và một chữ số.",
                        "error"
                    );


                    return;

                }



                // -------------------------
                // KHÔNG ĐƯỢC GIỐNG MẬT KHẨU CŨ
                // -------------------------

                if (currentPassword === newPassword) {


                    showAlert(
                        "Mật khẩu mới không được giống với mật khẩu hiện tại.",
                        "error"
                    );


                    return;

                }



                // -------------------------
                // XÁC NHẬN MẬT KHẨU
                // -------------------------

                if (newPassword !== confirmPassword) {


                    showAlert(
                        "Mật khẩu xác nhận không trùng khớp.",
                        "error"
                    );


                    return;

                }



                // =========================
                // ĐỔI MẬT KHẨU THÀNH CÔNG
                // =========================

                showAlert(
                    "Đổi mật khẩu thành công! Đang quay về trang chủ...",
                    "success"
                );


                form.reset();


                // Khóa nút để tránh bấm nhiều lần
                submitButton.disabled = true;


                // =========================
                // QUAY VỀ TRANG CHỦ
                // SAU 1.5 GIÂY
                // =========================

                setTimeout(() => {

                    window.location.href =
                        "../components/sidebar.html";

                }, 1500);

            });

        });

    </script>

</body>

</html>
