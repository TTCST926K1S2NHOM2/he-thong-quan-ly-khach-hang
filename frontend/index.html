<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <!-- =========================
                 TIÊU ĐỀ
            ========================== -->
            <h1>Đăng nhập</h1>


            <!-- =========================
                 FORM ĐĂNG NHẬP
            ========================== -->
            <form id="loginForm">

                <!-- TÀI KHOẢN -->
                <div class="form-group">

                    <label for="username">
                        Tài khoản
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập tài khoản"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- MẬT KHẨU -->
                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-button"
                            aria-label="Hiện hoặc ẩn mật khẩu"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <!-- =========================
                     QUÊN MẬT KHẨU
                ========================== -->
                <div class="forgot-password">

                    <a href="pages/forgot-password.html">
                        Quên mật khẩu?
                    </a>

                </div>


                <!-- =========================
                     NÚT ĐĂNG NHẬP
                ========================== -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Xác nhận
                </button>


                <!-- =========================
                     THÔNG BÁO
                ========================== -->
                <p id="message"></p>

            </form>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT ĐĂNG NHẬP
    ========================== -->
    <script src="js/login.js"></script>

</body>

</html>
