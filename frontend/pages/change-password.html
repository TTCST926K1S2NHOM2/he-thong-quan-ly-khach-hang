<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đổi mật khẩu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7f7fb;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================
           CARD
        ========================= */

        .change-password-container {
            width: 380px;

            background: #ffffff;

            padding: 36px 40px;

            border-radius: 22px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.10);
        }


        /* =========================
           TIÊU ĐỀ
        ========================= */

        .title {
            margin: 0 0 10px;

            text-align: center;

            color: #102a56;

            font-size: 30px;

            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 28px;

            text-align: center;

            color: #6680a5;

            font-size: 16px;

            line-height: 1.5;
        }


        /* =========================
           LABEL
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #102a56;

            font-size: 16px;

            font-weight: 600;
        }


        /* =========================
           INPUT
        ========================= */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;

            height: 48px;

            padding: 0 48px 0 16px;

            border: none;

            border-radius: 25px;

            outline: none;

            background: #eeeeF8;

            color: #333;

            font-size: 15px;

            transition: 0.2s;
        }

        .password-wrapper input::placeholder {
            color: #a5a9bb;
        }

        .password-wrapper input:focus {
            background: #e8e8f5;

            box-shadow:
                0 0 0 2px rgba(0, 102, 255, 0.12);
        }


        /* =========================
           NÚT HIỆN / ẨN MẬT KHẨU
        ========================= */

        .toggle-password {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #64748b;

            cursor: pointer;

            font-size: 18px;

            padding: 0;
        }

        .toggle-password:hover {
            color: #2563eb;
        }


        /* =========================
           NÚT ĐỔI MẬT KHẨU
        ========================= */

        .submit-button {
            width: 100%;

            height: 48px;

            margin-top: 8px;

            border: none;

            border-radius: 25px;

            background: #00e85a;

            color: #000000;

            font-size: 15px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.2s;
        }

        .submit-button:hover {
            background: #00d653;
        }

        .submit-button:disabled {
            opacity: 0.65;

            cursor: not-allowed;
        }


        /* =========================
           THÔNG BÁO
        ========================= */

        .alert-message {
            min-height: 22px;

            margin-top: 16px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;
        }

        .alert-message.error {
            color: #dc2626;
        }

        .alert-message.success {
            color: #16a34a;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 480px) {

            .change-password-container {
                width: calc(100% - 30px);

                padding: 30px 25px;
            }

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>

    <div class="change-password-container">

        <h1 class="title">
            Đổi mật khẩu
        </h1>

        <p class="subtitle">
            Nhập thông tin bên dưới để chủ động bảo vệ tài khoản
        </p>


        <form id="changePasswordForm">

            <!-- MẬT KHẨU HIỆN TẠI -->
            <div class="form-group">

                <label for="currentPassword">
                    Mật khẩu hiện tại
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Nhập mật khẩu hiện tại"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="currentPassword"
                        aria-label="Hiện hoặc ẩn mật khẩu"
                    >
                        
                    </button>

                </div>

            </div>


            <!-- MẬT KHẨU MỚI -->
            <div class="form-group">

                <label for="newPassword">
                    Mật khẩu mới
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Tối thiểu 8 ký tự (chứa chữ và số)"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="newPassword"
                        aria-label="Hiện hoặc ẩn mật khẩu"
                    >
                        
                    </button>

                </div>

            </div>


            <!-- XÁC NHẬN MẬT KHẨU -->
            <div class="form-group">

                <label for="confirmPassword">
                    Nhập lại mật khẩu mới
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Xác nhận mật khẩu mới"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                        aria-label="Hiện hoặc ẩn mật khẩu"
                    >
                        
                    </button>

                </div>

            </div>


            <!-- THÔNG BÁO -->
            <div
                id="alertMessage"
                class="alert-message"
            ></div>


            <!-- BUTTON -->
            <button
                type="submit"
                class="submit-button"
                id="submitButton"
            >
                Xác nhận đổi mật khẩu
            </button>

        </form>

    </div>


    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const form =
                document.getElementById("changePasswordForm");

            const alertMessage =
                document.getElementById("alertMessage");

            const submitButton =
                document.getElementById("submitButton");

            const toggleButtons =
                document.querySelectorAll(".toggle-password");


            // =========================
            // HIỆN / ẨN MẬT KHẨU
            // =========================

            toggleButtons.forEach(button => {

                button.addEventListener("click", () => {

                    const targetId =
                        button.getAttribute("data-target");

                    const input =
                        document.getElementById(targetId);

                    if (!input) {
                        return;
                    }

                    if (input.type === "password") {

                        input.type = "text";

                        button.textContent = "◉";

                    } else {

                        input.type = "password";

                        button.textContent = "◉";
                    }

                });

            });


            // =========================
            // HIỂN THỊ THÔNG BÁO
            // =========================

            function showAlert(message, type) {

                alertMessage.textContent =
                    message;

                alertMessage.className =
                    `alert-message ${type}`;
            }


            function hideAlert() {

                alertMessage.textContent = "";

                alertMessage.className =
                    "alert-message";
            }


            // =========================
            // SUBMIT
            // =========================

            form.addEventListener("submit", (event) => {

                event.preventDefault();

                hideAlert();


                const currentPassword =
                    document
                        .getElementById("currentPassword")
                        .value
                        .trim();


                const newPassword =
                    document
                        .getElementById("newPassword")
                        .value
                        .trim();


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value
                        .trim();


                // -------------------------
                // Kiểm tra mật khẩu hiện tại
                // -------------------------

                if (!currentPassword) {

                    showAlert(
                        "Vui lòng nhập mật khẩu hiện tại.",
                        "error"
                    );

                    return;
                }


                // -------------------------
                // Kiểm tra mật khẩu mới
                // -------------------------

                const passwordRegex =
                    /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;


                if (!passwordRegex.test(newPassword)) {

                    showAlert(
                        "Mật khẩu mới phải từ 8 ký tự trở lên, bao gồm ít nhất một chữ cái và một chữ số.",
                        "error"
                    );

                    return;
                }


                // -------------------------
                // Không được giống mật khẩu cũ
                // -------------------------

                if (currentPassword === newPassword) {

                    showAlert(
                        "Mật khẩu mới không được giống với mật khẩu hiện tại.",
                        "error"
                    );

                    return;
                }


                // -------------------------
                // Xác nhận mật khẩu
                // -------------------------

                if (newPassword !== confirmPassword) {

                    showAlert(
                        "Mật khẩu xác nhận không trùng khớp.",
                        "error"
                    );

                    return;
                }


                // -------------------------
                // Thành công
                // -------------------------

                showAlert(
                    "Đổi mật khẩu thành công! Các phiên đăng nhập khác đã được thu hồi.",
                    "success"
                );

                form.reset();

            });

        });
    </script>

</body>
</html>
