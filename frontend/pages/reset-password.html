<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đặt lại mật khẩu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .reset-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #172033;
        }

        .description {
            text-align: center;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            margin-top: 16px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        .back-login:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="reset-container">

        <h1>Đặt lại mật khẩu</h1>

        <p class="description">
            Nhập mật khẩu mới cho tài khoản của bạn.
        </p>

        <form id="resetPasswordForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Email tài khoản"
                required
            >


            <label for="token">
                Mã đặt lại mật khẩu
            </label>

            <input
                type="text"
                id="token"
                placeholder="Nhập mã/token"
                required
            >


            <label for="newPassword">
                Mật khẩu mới
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Nhập mật khẩu mới"
                required
            >


            <label for="confirmPassword">
                Xác nhận mật khẩu
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Nhập lại mật khẩu mới"
                required
            >


            <button
                type="submit"
                id="resetButton"
            >
                Đặt lại mật khẩu
            </button>

        </form>


        <div id="message"></div>


        <a
            href="../index.html"
            class="back-login"
        >
            ← Quay lại đăng nhập
        </a>

    </div>


    <script>

        const form =
            document.getElementById(
                "resetPasswordForm"
            );

        const emailInput =
            document.getElementById("email");

        const tokenInput =
            document.getElementById("token");

        const newPasswordInput =
            document.getElementById("newPassword");

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const button =
            document.getElementById(
                "resetButton"
            );

        const message =
            document.getElementById("message");


        // Lấy email/token đã lưu
        const savedEmail =
            sessionStorage.getItem(
                "resetEmail"
            );

        const savedToken =
            sessionStorage.getItem(
                "resetToken"
            );


        if (savedEmail) {
            emailInput.value = savedEmail;
        }

        if (savedToken) {
            tokenInput.value = savedToken;
        }


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();

                const token =
                    tokenInput.value.trim();

                const newPassword =
                    newPasswordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                // -------------------------
                // Kiểm tra dữ liệu
                // -------------------------
                if (
                    !email ||
                    !token ||
                    !newPassword ||
                    !confirmPassword
                ) {

                    message.textContent =
                        "Vui lòng nhập đầy đủ thông tin.";

                    message.style.color =
                        "#dc2626";

                    return;
                }


                // -------------------------
                // Kiểm tra mật khẩu
                // -------------------------
                if (
                    newPassword !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Mật khẩu xác nhận không khớp.";

                    message.style.color =
                        "#dc2626";

                    return;
                }


                button.disabled = true;

                button.textContent =
                    "Đang xử lý...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:8080/api/password/reset",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    token: token,
                                    newPassword:
                                        newPassword
                                })
                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "Reset password response:",
                        result
                    );


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        message.textContent =
                            result.message ||
                            "Đặt lại mật khẩu thất bại.";

                        message.style.color =
                            "#dc2626";

                        button.disabled = false;

                        button.textContent =
                            "Đặt lại mật khẩu";

                        return;
                    }


                    message.textContent =
                        result.message ||
                        "Đặt lại mật khẩu thành công.";

                    message.style.color =
                        "#16a34a";


                    // Xóa dữ liệu reset
                    sessionStorage.removeItem(
                        "resetEmail"
                    );

                    sessionStorage.removeItem(
                        "resetToken"
                    );


                    // Quay về Login
                    setTimeout(function() {

                        window.location.href =
                            "../index.html";

                    }, 1200);


                } catch (error) {

                    console.error(
                        "Reset password error:",
                        error
                    );

                    message.textContent =
                        "Không thể kết nối đến máy chủ.";

                    message.style.color =
                        "#dc2626";

                    button.disabled = false;

                    button.textContent =
                        "Đặt lại mật khẩu";
                }

            }
        );

    </script>

</body>
</html>
